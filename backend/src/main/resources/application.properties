spring.application.name=backend

# ==========================
# External secrets lookup (tries in order)
# ==========================
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./application-secrets.properties,optional:file:./config/application-secrets.properties

# ==========================
# DATABASE (XAMPP MySQL / MariaDB)
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/ntc_staff?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=1

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# MAIL
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

mail.from.name=NTC Leave Management

# ==========================
# JWT
# ==========================
jwt.expiration.ms=86400000

# ==========================
# Logging
# ==========================
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=INFO
logging.level.com.ntc.backend.service.EmailService=DEBUG
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN

logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.com.ntc.backend.security=DEBUG

# ==========================
# Multipart
# ==========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/signatures