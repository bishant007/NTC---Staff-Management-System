spring.application.name=backend

# ==========================
# External secrets lookup (tries in order)
# ==========================
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./application-secrets.properties,optional:file:./config/application-secrets.properties

# ==========================
# DATABASE (XAMPP MySQL / MariaDB)
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/ntc_staff?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=1

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Store timestamps in UTC at the DB layer, convert at the app layer to Nepal time
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================
# JSON / TIMEZONE (Nepal)
# ==========================
# Serialize/deserialize local date-times as Nepal time.
# NOTE: Jackson 3 (Spring Boot 4) removed WRITE_DATES_AS_TIMESTAMPS, so the
# old `spring.jackson.serialization.write-dates-as-timestamps` key must NOT
# be set here ? it crashes startup. The default is already ISO-8601 strings.
spring.jackson.time-zone=Asia/Kathmandu

# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# MAIL
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

mail.from.name=NTC Leave Management

# ==========================
# JWT / SESSION
# ==========================
# Access token lifetime: 30 minutes. Refresh token keeps users logged in
# for 30 days (via the token rotation flow in SessionService).
jwt.expiration.ms=1800000

# Refresh token lifetime in days ? used by SessionService.startSession()
jwt.refresh.expiration.days=30

# ==========================
# Logging
# ==========================
# Global baseline ? INFO prints startup/shutdown, key events, and all WARN/ERROR
logging.level.root=INFO

# Spring Mail ? quiet unless something's wrong
logging.level.org.springframework.mail=WARN

# Spring Security ? only warnings/errors, no per-request "Securing GET ..." spam
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.FilterChainProxy=WARN
logging.level.org.springframework.security.web.access=WARN

# Hikari connection pool ? quiet unless a real problem
logging.level.com.zaxxer.hikari=WARN

# Hibernate ? only warnings (SQL logging stays off via spring.jpa.show-sql=false)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN

# Your own code ? INFO level for general events
logging.level.com.ntc.backend=INFO

# Keep EmailService at DEBUG so email issues remain traceable
logging.level.com.ntc.backend.service.EmailService=DEBUG

# Your JWT filter chain ? no per-request debug noise
logging.level.com.ntc.backend.security=WARN

# ==========================
# Multipart
# ==========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/signatures