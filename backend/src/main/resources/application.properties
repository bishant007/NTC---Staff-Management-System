spring.application.name=backend

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/ntc_staff?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# SERVER
# ==========================
server.port=8081

# ==========================
# MAIL (SMTP) ? use your own
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password   
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# JWT
# ==========================
jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLongAndUnique
# JWT expiration: 24 hours, in milliseconds
jwt.expiration.ms=86400000